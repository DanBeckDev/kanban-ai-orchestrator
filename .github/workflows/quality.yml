name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-core:
    name: core (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify portable core
        run: npm run test:platform

  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up nightly Rust coverage tooling
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add --toolchain nightly llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify quality and coverage
        run: npm run quality:verify

      - name: Verify source structure
        if: github.event_name == 'pull_request'
        run: node scripts/check-code-structure.mjs --base-ref origin/${{ github.base_ref }}

      - name: Verify source structure for a non-initial push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/check-code-structure.mjs --base-ref ${{ github.event.before }}

      - name: Verify all source structure for an initial push or manual run
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        run: node scripts/check-code-structure.mjs --all

      - name: Verify quality-review receipt
        if: github.event_name == 'pull_request'
        run: node scripts/verify-quality-receipt.mjs --base-ref origin/${{ github.base_ref }}

      - name: Verify quality-review receipt for a non-initial push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/verify-quality-receipt.mjs --base-ref ${{ github.event.before }}

      - name: Verify recorded quality-review receipts for an initial push or manual run
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        run: node scripts/verify-quality-receipt.mjs --all
