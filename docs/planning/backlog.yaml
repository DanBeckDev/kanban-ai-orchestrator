schema_version: 1
project: Kanban AI Orchestrator
last_updated: 2026-08-09

# Status values: ready, in_progress, blocked, done.
# A task starts only after all IDs in depends_on are done unless its notes record an
# accepted exception. Keep this file as a repository export even after it is imported
# into the product's own board.

epics:
  - id: FDN
    title: Product and engineering foundation
  - id: CORE
    title: Durable local task and dependency engine
  - id: EXEC
    title: Safe Git workspaces and agent execution
  - id: ORCH
    title: Orchestration, policy, and review
  - id: UX
    title: Usable desktop experience and design validation
  - id: APP
    title: Local desktop board experience
  - id: LIN
    title: Linear first-class integration
  - id: REL
    title: Reliability and cross-platform release
  - id: QUAL
    title: Code quality, review, and coverage gates

tasks:
  - id: FDN-001
    epic: FDN
    title: Accept the product documentation and delivery contract
    status: done
    priority: P0
    depends_on: []
    acceptance_criteria:
      - Product, architecture, Linear, reliability, roadmap, and ADR documents exist.
      - Future workers have an explicit working agreement and documentation precedence.
    notes: Initial source-of-truth documentation created on 2026-08-08.

  - id: FDN-002
    epic: FDN
    title: Select and record the desktop/runtime technology stack
    status: done
    priority: P0
    depends_on: [FDN-001]
    acceptance_criteria:
      - Desktop shell, UI, local daemon, persistence, PTY, credential storage, and packaging choices are documented in an ADR.
      - The choice is evaluated on macOS, Windows, Linux, local-first operation, and agent adapter needs.
      - The selected TypeScript and Rust tooling can enforce per-package line, statement, function, and branch coverage thresholds of at least 80%.
    notes: Tauri 2, React/TypeScript, Rust, SQLite, Vitest, and cargo-llvm-cov selected in ADR 0005. The desktop bootstrap, icons, per-package coverage gates, and full local verification passed on 2026-08-08.

  - id: CORE-001
    epic: CORE
    title: Define executable domain schemas and state-machine transitions
    status: done
    priority: P0
    depends_on: [FDN-002]
    acceptance_criteria:
      - Project, board, work item, execution, evidence, policy decision, and external-link schemas are versioned.
      - Allowed and disallowed state transitions are unit tested.
      - Done, failed, interrupted, cancelled, and blocked remain distinct states.
    notes: Versioned Rust domain records and the guarded work-item transition state machine were implemented and verified on 2026-08-08. Done requires completion evidence and configured human-review acceptance.

  - id: CORE-002
    epic: CORE
    title: Implement the typed dependency graph and eligibility evaluator
    status: done
    priority: P0
    depends_on: [CORE-001]
    acceptance_criteria:
      - All incoming hard blockers must be satisfied before a task becomes eligible.
      - Cycle insertion is rejected with an actionable explanation.
      - Critical path, upstream/downstream blockers, and safe parallel tasks can be calculated.
    notes: Versioned typed dependencies, hard-cycle validation, explainable eligibility, graph traversal, and dependency-safe parallel-ready task selection were implemented and verified on 2026-08-08. Hard blockers require accepted completion evidence or review acceptance and must name a reason, owner, and next action.

  - id: CORE-003
    epic: CORE
    title: Build durable event persistence and restart reconciliation
    status: done
    priority: P0
    depends_on: [CORE-001]
    acceptance_criteria:
      - Events and materialized state are persisted transactionally.
      - Simulated daemon interruption preserves task history and marks uncertain runs as interrupted.
      - UI reconnect cannot change task state by itself.
    notes: SQLite migrations, append-only versioned events, transactional materialized snapshots, idempotent command handling, and restart reconciliation were implemented and verified on 2026-08-08. Unconfirmed running or awaiting-input work becomes interrupted only through an explicit daemon recovery command; opening the store for a UI reconnect has no task-state side effect. Newer database schemas fail closed to prevent an older app from writing incompatible data.

  - id: EXEC-001
    epic: EXEC
    title: Implement project boundary and safe worktree provisioning
    status: done
    priority: P0
    depends_on: [CORE-001, CORE-003]
    acceptance_criteria:
      - Provisioning is idempotent and recoverable after interruption.
      - An execution is verified to be in its assigned worktree before launch.
      - Base repository mutation and undeclared path access are denied or require a recorded approval.
      - Dependency sharing has explicit strategies; no symlink behavior is forced.
    notes: External Git worktree provisioning, path authorization, and launch verification were implemented and verified on 2026-08-08. The manager validates that the declared project base ref resolves to a commit, derives task branches from it, reuses registered worktrees safely, recovers only an empty interrupted target, rejects root/branch/path conflicts and symlinks, and permits worker access only inside the assigned worktree. Its structured Git boundary also strips inherited repository-context variables and configuration injection, preventing a caller from redirecting worktree or index state. Dependency sharing is explicit and records no forced link behavior.

  - id: EXEC-002
    epic: EXEC
    title: Define and test the agent adapter contract
    status: done
    priority: P0
    depends_on: [CORE-001, CORE-003]
    acceptance_criteria:
      - Capability discovery and normalized lifecycle events are specified.
      - A deterministic fake adapter covers completion, error, approval, interruption, duplicate event, and resume cases.
      - Adapter event input cannot produce an illegal task transition.
    notes: Completed on 2026-08-08 with a provider-neutral Rust lifecycle contract, deterministic fake adapter, ordered event ingestor, and tests proving completion stops at review while errors, interruption, approvals, duplicates, resume, and illegal transitions remain explicit.

  - id: EXEC-003
    epic: EXEC
    title: Add initial Codex CLI, Claude Code, and third-agent adapters
    status: done
    priority: P1
    depends_on: [EXEC-001, EXEC-002]
    acceptance_criteria:
      - Three adapters pass the common conformance suite.
      - Unsupported capabilities are visible before task start.
      - Per-agent session recovery and process-tree cancellation behavior is documented and tested.
    notes: >-
      Completed on 2026-08-08 with three provider-neutral execution profiles: a
      generic structured JSONL bridge, a native Codex CLI wrapper, and a native
      Claude Code wrapper. Each runs without a production shell, receives the
      brief through stdin, converts bounded structured output to safe normalized
      events, and passes one shared non-interactive conformance suite. The desktop
      profile and launch UI show the selected provider and its unavailable
      feedback, session-recovery, and safe process-tree cancellation capabilities
      before start. Codex protocol/sandbox controls and Claude protocol/permission
      controls are adapter-owned and profile validation rejects attempts to
      override them. Resume, interactive feedback, and process-tree cancellation
      remain explicitly unsupported until future provider/platform adapters prove
      them.

  - id: EXEC-004
    epic: EXEC
    title: Add a ClinePass CLI worker adapter
    status: done
    priority: P1
    depends_on: [EXEC-003]
    acceptance_criteria:
      - A ClinePass profile starts Cline's documented JSON event stream from the assigned worktree.
      - Cline account credentials and ClinePass entitlement selection never enter board metadata or SQLite.
      - Provider, credentials, approval, worktree, and protocol options remain adapter-owned and Cline lifecycle events pass the common conformance suite.
    notes: Completed on 2026-08-09 with a dedicated ClinePass CLI profile. It uses the user's separately authenticated Cline account, fixes the Cline provider and noninteractive event/approval flags at the adapter boundary, normalizes only fixed Cline lifecycle summaries and usage, and rejects profile arguments that could supply a key, change billing/provider choice, detach the session, replace the worktree, or weaken the event contract.

  - id: ORCH-001
    epic: ORCH
    title: Implement policy, budget, and approval decisions
    status: done
    priority: P0
    depends_on: [CORE-001, CORE-003, EXEC-001]
    acceptance_criteria:
      - Policies govern tool scope, parallelism, time/cost limits, and protected Git actions.
      - Allow, deny, and approval-required decisions have audit records.
      - The system prevents execution outside policy even when agent prompts conflict.
    notes: Implemented on 2026-08-08. The typed daemon policy gate enforces project and work-item budget limits, returns an opaque execution capability only for allows, records every decision durably, and verifies exact stored Git approvals before it can authorize a protected action.

  - id: ORCH-002
    epic: ORCH
    title: Build plan-preview and daemon-owned dependency scheduler
    status: done
    priority: P0
    depends_on: [CORE-002, EXEC-002, ORCH-001]
    acceptance_criteria:
      - A proposed plan lists tasks, criteria, dependencies, critical path, parallelism, budgets, and unresolved assumptions.
      - User confirmation is required before launch.
      - Scheduling continues correctly while the UI is hidden or disconnected.
    notes: Completed on 2026-08-08 with a provider-neutral daemon scheduling use case. It produces a deterministic typed plan preview, rejects invalid or unconfirmed plans, evaluates hard dependencies from daemon progress, separately defers for repository capacity, and returns only policy-authorized starts. Tests prove scheduling does not require UI state, and ADR 0009 requires durable plan-confirmation persistence when application-level restart-resume is wired. After review feedback, plan validation, scheduling, shared fixtures, and focused test scenarios were split into 14–323-line modules and are protected by the ADR 0010 source-structure gate.

  - id: ORCH-003
    epic: ORCH
    title: Build evidence-first review and recovery flows
    status: done
    priority: P1
    depends_on: [CORE-003, EXEC-001, EXEC-002, ORCH-001]
    acceptance_criteria:
      - Review shows task criteria, diff/commit, checks, agent summary, and decision history.
      - Failure and interruption present retry, inspect, recover, and cancel actions.
      - A task cannot reach done without the configured evidence and approval.
    notes: Completed on 2026-08-08. Board snapshots carry a compact ordered trail of the most recent 20 durable task creation and state-decision events per task, plus bounded recent execution attempts and evidence records. Cards preserve and render agent/session/workspace/usage context, diff/commit evidence, checks, completion reports, and reviewer decisions after reopening. The execution-event controller activates a pending attempt atomically with its session and `Running` task transition, rejects unstarted or out-of-order events, checkpoints usage/status monotonically, and persists input/failure/interruption/completion reports as evidence. The desktop monitors one verified, policy-authorized process per execution independently of the UI; completion moves only to `Review`. Recovery offers attempt inspection, recover-to-Ready/retry, and cancellation. A human-reviewed task cannot reach Done until passing checks, completion report, and a durable accepted review decision all exist.

  - id: ORCH-004
    epic: ORCH
    title: Generate safe plan proposals from natural-language goals
    status: done
    priority: P0
    depends_on: [APP-003, EXEC-003]
    acceptance_criteria:
      - A user can submit a goal and select a provider-neutral planner profile; the planner can produce only one typed, unconfirmed plan proposal for the selected board.
      - Planner I/O is bounded, runs without a production shell, and parses only a strict plan payload; raw provider transcripts, credentials, and arbitrary lifecycle output are not persisted.
      - A malformed, oversized, wrong-board, or invalid planner proposal cannot create or confirm tasks, and returns an actionable error while leaving the board unchanged.
      - The proposal is shown through the existing exact preview and confirmation workflow, including dependencies, critical path, parallel stages, budgets, and assumptions.
    notes: Completed on 2026-08-08 with durable provider-neutral planner profiles, a direct bounded process bridge, strict draft parsing, and daemon-derived plan/task/dependency identity. The UI accepts a goal, shows the existing exact preview, and preserves explicit confirmation as the only task-materialization authority. Planner I/O is capped at 8,000-byte goals, 65,536-byte output, and 45 seconds; raw goals, standard error, and raw provider output are not persisted. A generic profile remains explicitly user-trusted local code rather than a claimed filesystem sandbox; provider-specific sandbox guarantees must be implemented and tested by a dedicated adapter.

  - id: APP-001
    epic: APP
    title: Expose durable local projects, boards, and dependencies through the desktop command boundary
    status: done
    priority: P0
    depends_on: [CORE-001, CORE-002, CORE-003]
    acceptance_criteria:
      - Projects, boards, work items, and typed dependencies persist locally and survive reopening the same database.
      - Project and board creation, board snapshots, work-item creation, state transitions, and dependency insertion are exposed through typed Tauri commands.
      - The command boundary cannot bypass the daemon state machine, board ownership checks, dependency-cycle validation, or evidence requirements.
      - Command and persistence tests cover valid behavior, duplicate identifiers, missing ownership, invalid dependencies, and a reopen scenario.
    notes: Added on 2026-08-08 after the product audit found that the desktop rendered only a foundation card despite the existing domain core. Completed on 2026-08-08 with durable SQLite project, board, work-item, and dependency storage plus typed Tauri commands that remain behind the domain state-machine and validation boundary.

  - id: APP-002
    epic: APP
    title: Build the interactive dependency-aware desktop board
    status: done
    priority: P0
    depends_on: [APP-001]
    acceptance_criteria:
      - A user can create a project, board, and work items; see their states, criteria, budgets, blockers, and typed dependencies after restart.
      - The board clearly separates Ready, active, Review, Done, and recovery work and explains every blocker with reason, owner, and next action.
      - The UI sends commands to the local daemon and never derives authoritative scheduling or state transitions itself.
      - Accessible component tests cover task creation, state-transition feedback, dependency visibility, and error presentation.
    notes: Completed on 2026-08-08 with a Tauri-command-backed React board. Users can create or reopen local boards, create budgeted tasks, submit guarded transitions with completion evidence, manage typed dependencies, see dependency responsibility, and distinguish plan, ready, active, review, done, and recovery work. The board only presents daemon responses; it does not own persistence or state-machine authority.

  - id: APP-003
    epic: APP
    title: Materialize durable, user-confirmed plan proposals through the desktop board
    status: done
    priority: P0
    depends_on: [APP-001, APP-002, ORCH-002]
    acceptance_criteria:
      - A provider-neutral proposal can be submitted for one existing board and is rendered as its exact task, dependency, critical-path, parallel-stage, budget, and assumption preview.
      - Confirmation names a user and time, survives reopening, and atomically creates the proposed tasks and validated dependencies exactly once.
      - A rejected, mismatched, cross-board, duplicate, or already-confirmed proposal cannot partly mutate the board.
      - The desktop clearly distinguishes an unconfirmed preview from a confirmed plan and sends only typed commands to the local daemon.
    notes: Completed on 2026-08-08 with typed desktop commands, a durable SQLite proposal/confirmation record, exact daemon-generated previews, and one atomic materialization transaction. The UI can inspect, revise, cancel, reject, or confirm an unconfirmed proposal; confirmation records identity and time, survives reopening, and is idempotent on retry. Tests cover no partial mutation for mismatched, cross-board, duplicate, collision, and already-confirmed requests. A future provider-neutral orchestrator adapter will generate this same safe proposal contract.

  - id: UX-001
    epic: UX
    title: Define the outcome-first desktop experience and acceptance scenarios
    status: done
    priority: P0
    depends_on: [APP-003, ORCH-003, ORCH-004, LIN-003]
    acceptance_criteria:
      - A product UX strategy defines the board library, first-board, returning-user, planning, dependency, recovery, Linear, accessibility, and cross-platform interaction model.
      - It identifies current internal-ID and dense-setup failures, measurable acceptance scenarios, non-goals, and research evidence.
      - Requirements and the roadmap explicitly make recognition-based re-entry, generated IDs, native repository selection, outcome-first planning, and dependency explanation mandatory.
    notes: Completed on 2026-08-09 in docs/product/user-experience.md after repository audit and current Apple, Tauri, and Linear documentation research. Book CTX was not installed in the active workspace, so no unavailable skill was represented as evidence.

  - id: UX-002
    epic: UX
    title: Build a durable board library and recognition-based re-entry
    status: ready
    priority: P0
    depends_on: [UX-001, UX-008, APP-001]
    acceptance_criteria:
      - The daemon exposes a typed, local board-library query that contains only the metadata required to recognise and safely open a board: display name, repository context, availability, last-opened time, and derived attention summary.
      - The initial desktop screen lists saved boards in deterministic recent-first order and offers a clear Continue action; opening a board never requires a board or project ID.
      - An empty library provides a single clear Create a board action. An unavailable repository is diagnosed with a locate/retry path before a board snapshot is loaded.
      - Last-opened state survives restart, stays local, and does not leak repository metadata to providers or Linear. Rust and frontend tests cover empty, recent, unavailable, and reopened-board paths.
    notes: Keep this as the first implementation PR. Do not combine it with the new-board form, graph, or visual refresh; it establishes the small authoritative directory contract needed by every later UX slice.

  - id: UX-003
    epic: UX
    title: Replace ID-driven board setup with a guided repository-first flow
    status: ready
    priority: P0
    depends_on: [UX-001, UX-008, UX-002, APP-002]
    acceptance_criteria:
      - The primary create flow asks only for an editable board name and a repository chosen with Tauri's native directory picker; it proposes the repository folder name and validates that the chosen folder is the Git repository root.
      - Project and board IDs are generated by the local command boundary, never typed by a normal user, and are available only in advanced support details.
      - The default base ref and standard policy are displayed as safe defaults. Their overrides are in a collapsed Advanced setup section with clear effect text.
      - Cancelling or failing validation does not persist a partial project/board. A successful creation opens the board home and preserves all existing project-boundary protections.
      - Tests exercise picker cancellation, invalid/non-root repository selection, generated identifiers, default/advanced configuration, and successful creation at the required coverage threshold.
    notes: This is intentionally a separate PR from UX-002 because it adds a Tauri capability, migration-safe command changes, and a user-facing form replacement.

  - id: UX-004
    epic: UX
    title: Make the board home outcome-first and action-oriented
    status: ready
    priority: P0
    depends_on: [UX-001, UX-008, UX-003, ORCH-004]
    acceptance_criteria:
      - A new or empty board leads with Describe the outcome, selected planner profile, and a short explanation that the proposed plan must be reviewed before work starts.
      - The board home derives Needs your attention, Work in motion, and Delivery picture sections from the daemon snapshot; each item links to its specific task/decision and carries no UI-owned scheduling logic.
      - Manual task creation is an explicit secondary action, while the exact existing plan-preview, assumptions, dependency, budget, rejection, and confirmation semantics remain intact.
      - Review, blocked, failed, interrupted, connector-conflict, and policy states are distinguishable and lead to permitted next actions.
      - Component and command-level tests prove the primary path cannot start an agent or hide an unresolved assumption before the existing confirmation/policy gates.
    notes: Preserve the provider-neutral planner boundary. This work improves information priority and copy; it does not change scheduling authority.

  - id: UX-005
    epic: UX
    title: Add an explainable dependency and impact experience
    status: ready
    priority: P1
    depends_on: [UX-001, UX-008, UX-002, CORE-002, ORCH-003]
    acceptance_criteria:
      - A named Dependencies view offers both a navigable visual graph and an equivalent accessible list based solely on the authoritative typed graph.
      - Selecting a task shows hard upstream blockers, downstream impact, dependency type, reason, owner, next action, critical-path membership, and parallel-safe neighbours where applicable.
      - Every card/task detail can answer why work is not ready without requiring the user to read an edge direction, infer a colour, or know an ID.
      - Cycles, contract, review-required, and soft edges retain the existing semantic distinctions; the UI never lets visual convenience weaken validation or eligibility.
      - Keyboard and screen-reader tests cover task selection, blocker explanation, graph-equivalent list navigation, and focus restoration.
    notes: Keep graph rendering isolated from eligibility calculation. If a graph library cannot provide the accessible equivalent, ship the list-first view and defer the visual enhancement.

  - id: UX-006
    epic: UX
    title: Redesign task detail, review, and recovery with progressive disclosure
    status: ready
    priority: P1
    depends_on: [UX-001, UX-008, UX-004, ORCH-003, REL-001]
    acceptance_criteria:
      - Board cards show task title, state, principal actor, and the next relevant fact before identifiers, raw configuration, or long evidence history.
      - Task detail leads with the current decision, state explanation, evidence status, and permitted action; expandable sections contain criteria, dependency context, activity, checks, Git references, and history.
      - Failed, interrupted, awaiting-input, review, and done states have distinct language, visual treatment, keyboard actions, and recovery consequences.
      - Bounded activity-stream and evidence privacy rules remain intact; no raw transcript, secret, or unbounded payload becomes part of the card or board snapshot.
      - Tests cover progressive-disclosure state, focus management, evidence/recovery presentation, and the normal/reduced-motion responsive layouts.
    notes: Split presentational components by responsibility before implementation; the source-structure rule applies to every new component and test file.

  - id: UX-007
    epic: UX
    title: Validate the redesigned experience with representative developer scenarios
    status: ready
    priority: P1
    depends_on: [UX-003, UX-004, UX-005, UX-006]
    acceptance_criteria:
      - At least five representative developers complete the documented first-board, returning-board, first-plan, blocker, and recovery scenarios on a current desktop build.
      - Findings distinguish critical failures from usability refinements, contain no credentials, repository paths, private diffs, or raw agent transcripts, and are recorded as linked backlog items with an owner and disposition.
      - No critical scenario failure remains open at the Phase 6 exit gate. The final accessibility pass covers keyboard-only traversal, visible focus, non-colour state communication, and graph/list equivalence.
    notes: This is validation work, not permission to collect product telemetry. Use an opt-in local study protocol and retain only minimal anonymized notes.

  - id: UX-008
    epic: UX
    title: Map and test the first-use and returning-user journeys before production UI work
    status: ready
    priority: P0
    depends_on: [UX-001]
    acceptance_criteria:
      - A now map records how representative developers currently create, reopen, plan, supervise, review, and recover agent work, including pains, workarounds, questions, and the distinction between new and returning use.
      - A later-map prototype covers the Find work, Set up safely, and Describe an outcome backbone activities and explicitly shows board-library, repository-picker, generated-ID, safe-default, and plan-confirmation behaviour.
      - At least three representative developers, including one keyboard-first or assistive-technology user where possible, complete a moderated scenario walkthrough of the prototype. Their feedback is anonymized and produces a disposition for every critical or recurring finding.
      - The documented prototype decisions identify which defaults are safe, which choices require explicit confirmation, and which advanced controls are intentionally deferred. No production source code is changed in this task.
    notes: This is the first executable UX task despite its later identifier. It applies the BookCtx User Story Mapping now-map/later-map and release-slicing practice before implementation, and the Inclusive Design Needs Walkthrough before a graph or card design becomes expensive to change.

  - id: LIN-004
    epic: LIN
    title: Productize the Linear connection entry experience
    status: ready
    priority: P1
    depends_on: [UX-001, UX-008, LIN-001, LIN-002, LIN-003]
    acceptance_criteria:
      - The normal connection path does not ask a user to supply an OAuth client ID or redirect URI; it uses a documented product-managed configuration or is explicitly unavailable with a truthful next step.
      - If self-managed OAuth remains supported, it is isolated behind Advanced setup with clear callback, scope, storage, refresh, and revocation guidance.
      - Board creation and board home clearly distinguish local-only, read-only Linear, and linked-execution modes before import or externally visible comment actions.
      - Connection errors, expired credentials, restricted scopes, conflicts, and uncertain delivery use concise recovery language and never imply that remote data was changed when it was not.
      - Tests retain OAuth state/PKCE/credential boundaries and cover mode-specific empty, connected, error, and reconnect UI states.
    notes: A consumer-grade Linear entry path requires an explicit owner for the OAuth application, privacy notice, app registration, and credential-lifecycle support. Do not silently substitute a shared client configuration for the existing self-managed design.

  - id: LIN-001
    epic: LIN
    title: Specify and spike Linear OAuth, local refresh, and token storage
    status: done
    priority: P0
    depends_on: [FDN-002, CORE-001]
    acceptance_criteria:
      - OAuth/PKCE callback design, scopes, token refresh, and keychain storage are verified against Linear's current API.
      - The local-first refresh approach respects Linear rate-limit guidance.
      - The public-webhook relay remains optional and is not required for core use.
    notes: >-
      Completed on 2026-08-09. The desktop OAuth/PKCE foundation is implemented
      and tested against Linear's current authorization, token, refresh, and
      rate-limit contract: an explicit loopback callback, state validation, S256
      challenge, system-browser launch, native credential storage, bounded
      refresh, and read-only scope. Linear's documented April 2026 refresh-token
      migration was audited: current and legacy scope responses parse, and a
      replacement credential is stored only after success. A live end-to-end
      verification needs a user-created Linear OAuth app configured with the
      declared callback URI; no client secret or API token will be requested in
      this repository.

  - id: LIN-002
    epic: LIN
    title: Implement Linear issue/project links and provenance-aware import
    status: done
    priority: P0
    depends_on: [CORE-001, CORE-002, LIN-001]
    acceptance_criteria:
      - Links use immutable Linear IDs and retain source/provenance.
      - Linear blockers import into the typed dependency graph without bypassing cycle validation.
      - Read-only and linked-execution connection modes work independently.
    notes: Completed on 2026-08-09. The durable import foundation and authenticated assigned-issue retrieval retain immutable Linear UUIDs, explicit provenance and connection mode, safe HTTPS Linear URLs, and typed-cycle validation for imported blockers. Once the user connects through LIN-001 OAuth, an explicit UI action queries at most 50 assigned issues by recent update and pre-fills the same validated local-import flow; it neither polls nor writes remotely. Live project selection and all remote write/sync behavior remain incomplete in LIN-003; the board must not imply that those capabilities exist.

  - id: LIN-003
    epic: LIN
    title: Implement conflict-safe Linear synchronization and comments
    status: done
    priority: P1
    depends_on: [CORE-003, ORCH-003, LIN-002]
    acceptance_criteria:
      - Outbound changes use a durable idempotent outbox.
      - Concurrent shared-field edits create reconciliation items instead of overwriting data.
      - Transcripts, secrets, and private diffs are excluded from outbound comments by default.
    notes: Completed on 2026-08-09. Linear linked-execution comments use a durable SQLite outbox with local idempotency, guarded pending-to-delivering-to-delivered transitions, targeted comments:create reauthorization, and explicit user send. A network or restart ambiguity becomes visible delivery_uncertain state with no automatic duplicate retry. An explicit per-issue refresh records immutable title, description, and workflow-state comparisons keyed by Linear revision; conflicts show both values and never overwrite either system. The manually entered one-line public comment input excludes raw agent transcripts, terminal output, secrets, and diffs. Full local quality:verify passed with all source paths under 400 meaningful lines and every required frontend/Rust coverage metric at least 80%.

  - id: REL-001
    epic: REL
    title: Build responsive terminal/activity data paths
    status: done
    priority: P0
    depends_on: [FDN-002, CORE-003, EXEC-002]
    acceptance_criteria:
      - Live agent activity is exposed as normalized chunks of at most 1 KiB, retained only in a bounded per-execution buffer, and raw provider transcripts remain outside board snapshots and durable state.
      - An activity request returns no more than 32 chunks; the card viewer virtualizes its fixed-height rows, so switching cards never requires rendering an unbounded terminal snapshot.
      - Activity chunks are recorded by the existing per-execution reader/monitor path; event ingestion starts no additional runtime or worker per event.
    notes: Completed on 2026-08-09. A bounded 1 KiB/128-chunk ephemeral daemon stream, 32-chunk paging, and a virtualized card viewer passed local quality gates and GitHub Actions full quality plus core Linux/macOS/Windows checks (run 31285775277). A Linux CI timing-dependent detached-process test was replaced with a deterministic scripted-adapter lifecycle test; the receipt records the finding and remediation.

  - id: REL-002
    epic: REL
    title: Establish macOS, Windows, and Linux test and packaging matrix
    status: done
    priority: P0
    depends_on: [FDN-002, CORE-001, EXEC-001]
    acceptance_criteria:
      - CI exercises core domain/workspace tests on all three desktop platforms.
      - Agent command construction avoids OS command-line length limits.
      - Packaging/signing and platform-specific credential/PTY behavior have tracked test coverage.
    notes: GitHub Actions core matrix and full quality gate passed on Linux, macOS, and Windows on 2026-08-09 (run 31283847977). Windows-native file URLs, Git verbatim worktree paths, and the detached-runtime CI observation deadline were corrected before completion. The platform release evidence documents remaining native signing, credential, PTY, and provider-lifecycle checks.

  - id: REL-003
    epic: REL
    title: Automate reliability release-gate scenarios
    status: done
    priority: P1
    depends_on: [CORE-002, CORE-003, EXEC-003, ORCH-003, LIN-003, REL-001, REL-002]
    acceptance_criteria:
      - Restart, cancellation, dependency, worktree-race, connector-conflict, and scope-escape scenarios are automated where practical.
      - Remaining manual release checks are documented with owner and evidence.
    notes: Completed on 2026-08-09. The named reliability command runs nine Unix scenarios (eight on Windows, where direct-process cancellation is deliberately not claimed), including durable restart recovery, dependency blocking/cycle rejection, cross-process daemon locking and worktree recovery, Linear conflict/ambiguous-delivery protection, and scope escape. It is included in the three-platform core command. The platform release document records accountable owners and required evidence for the remaining target-native checks.

  - id: QUAL-001
    epic: QUAL
    title: Define the mandatory review, remediation, and coverage policy
    status: done
    priority: P0
    depends_on: [FDN-001]
    acceptance_criteria:
      - Every code-bearing task requires Clean Code review, remediation of actionable findings, and a quality-review receipt.
      - The repository defines 80% per-package line, statement, function, and branch coverage as a hard floor.
      - The policy distinguishes actionable defects from documented design trade-offs.
    notes: Completed on 2026-08-08 in docs/quality/code-requirements.md and ADR 0004.

  - id: QUAL-002
    epic: QUAL
    title: Implement local hook and required CI quality gate
    status: done
    priority: P0
    depends_on: [FDN-002, QUAL-001]
    acceptance_criteria:
      - The repository provides quality:changed, test:coverage, and quality:verify commands.
      - The installable pre-commit hook runs quality:changed for code-bearing changes.
      - Required CI runs quality:verify and fails if any executable package/crate falls below 80% coverage in any required metric.
      - CI validates a zero-unresolved-findings review receipt for code-bearing work.
    notes: Local hook, quality commands, receipt validator, and GitHub Actions workflow were implemented and verified on 2026-08-08. The public repository was created, the quality workflow passed on GitHub Actions, and main now requires an up-to-date passing quality status check for all users including administrators.

  - id: QUAL-003
    epic: QUAL
    title: Enforce quality evidence in the product's agent workflow
    status: done
    priority: P0
    depends_on: [CORE-001, ORCH-001, ORCH-003, QUAL-001]
    acceptance_criteria:
      - Every review-to-done transition requires a passed `quality_gate` evidence record created after the current implementation completion report; a generic passed check is not sufficient.
      - In the MVP, `requires_human_review` is the explicit substantial/high-risk designation. When its implementation reaches review, the daemon durably records that an independent Clean Code review is required.
      - An independent review is a durable review-role execution for the same work item, using an agent-profile name different from every implementation-role execution. The reviewer completion, reviewer profile, concise decision summary, and actionable-finding count are recorded without retaining a raw transcript.
      - A zero-finding independent review can satisfy the independent-review gate only after its own review-role execution has completed. One or more actionable findings record a failed review and return the work item from review to ready for another implementation attempt.
      - A later implementation attempt invalidates earlier completion, quality-gate, and review evidence for done eligibility; the complete evidence sequence must be recorded again after that attempt.
    notes: Implemented and verified on 2026-08-08. The daemon distinguishes current-cycle quality gates from generic checks, schedules and validates role-separated independent reviews, persists one bounded review decision per reviewer run, returns findings to Ready atomically, and requires the independent decision before human acceptance. See ADR 0016 and quality receipt QUAL-003.

  - id: QUAL-004
    epic: QUAL
    title: Remove all temporary oversized-source exceptions
    status: done
    priority: P0
    depends_on: [QUAL-002]
    acceptance_criteria:
      - Every file listed in docs/quality/code-structure-exceptions.json is split into cohesive production or focused test modules with no behavior change.
      - npm run structure:verify and CI reject any oversized source file and any non-empty exception ledger.
      - The exceptions list is empty when QUAL-004 is complete, and the full quality gate passes after each refactor.
    notes: >-
      Added on 2026-08-08 after the Clean Code review process incorrectly treated
      file cohesion as sufficient without challenging 600+ line source files.
      Completed on 2026-08-08: every listed module was split into focused source
      and test modules, the exception ledger is empty, and the full-repository
      gate now rejects any future exception.

  - id: QUAL-005
    epic: QUAL
    title: Require structural review evidence for every changed source file
    status: done
    priority: P0
    depends_on: [QUAL-004]
    acceptance_criteria:
      - Every changed source file is listed in the quality-review receipt with its exact meaningful-line count, cohesive responsibility, and review decision.
      - The receipt validator rejects missing or stale source-structure evidence while retaining validation of historical receipts.
      - Focused tests prove a receipt cannot omit a changed source file and a complete inventory passes.
    notes: Completed on 2026-08-08. Quality-review receipts now inventory every changed source file with its verified meaningful-line count, cohesive responsibility, and decision; the validator rejects omissions and stale counts while historical receipts remain readable.

  - id: QUAL-006
    epic: QUAL
    title: Fail CI policy early and cache stable Rust checks safely
    status: done
    priority: P0
    depends_on: [QUAL-002, QUAL-005, REL-002]
    acceptance_criteria:
      - Source-structure and review-receipt policy fail before the platform matrix or full coverage suite starts.
      - Stable Cargo test and Clippy inputs are cached per platform, compiler identity, and dependency graph without caching credentials or nightly coverage artifacts.
      - Linux, macOS, and Windows portable-core checks and the Linux full 80%-coverage quality gate remain required.
    notes: Completed on 2026-08-09. CI validates source structure and review evidence in a lightweight prerequisite job, then runs the full Linux coverage gate and Linux/macOS/Windows portable-core matrix only when policy passes. Stable Cargo registry, Git dependencies, and artifacts are cached by OS, architecture, Rust compiler identity, Cargo lockfile, and manifest; nightly coverage output is isolated and cargo-llvm-cov is installed from its verified release installer. The initial foundation's 64 missing source-structure inventory entries were reviewed and recorded rather than weakening the PR policy.
