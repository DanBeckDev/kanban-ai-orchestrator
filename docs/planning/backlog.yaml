      - Settings provides an obvious Agent section that detects the locally installed Codex CLI, Claude Code, and Cline CLI without executing them. A person can choose any installed provider in one action; the product saves a safe native profile and uses that choice as the default for new task runs.
      - Missing providers are truthfully marked as not installed and provide an official installation path. The app never silently installs software, exposes credentials, or exposes adapter-owned protocol, worktree, provider, or permission flags on the normal path.
      - Planning, Linear, project/support, and manual/custom profile configuration are separately navigable settings or task-management surfaces. Advanced controls use plain language and cannot obstruct planning or board supervision.
      - Component, gateway, and Rust tests cover provider discovery, one-click safe-profile selection, compact-card/task-detail progressive disclosure, keyboard navigation, missing-provider guidance, and the existing policy/plan/review gates. All executable coverage metrics remain at least 80%.
    notes: >-
      Completed on 2026-08-09 as one focused implementation goal. The board
      now separates compact delivery cards from task detail, management, plan,
      and settings surfaces. Provider discovery checks only trusted executable
      paths; choosing Codex, Claude Code, or Cline creates a safe native default
      profile only after it has persisted. Missing Cline stays visible with its
      official install guide. Cards name their upstream hard blocker where one
      exists. This intentionally does not add unattended installation,
      arbitrary executable probing, or a visual-only dependency graph without
      an accessible explanation.

