      redundant visual/text explanations that describe the user outcome rather than
      graph internals. Project inference: pair a visual map with a plain-language
      list and inspector, and reserve daemon-owned scheduling decisions for the
      scheduler. Completed 2026-08-09 with a standalone visual map, equivalent task
      list, selected-task inspector, guarded current-plan context, and compact-card
      links to named blocker explanations.

