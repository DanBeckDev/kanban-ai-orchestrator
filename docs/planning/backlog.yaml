schema_version: 1
project: Kanban AI Orchestrator
last_updated: 2026-08-09

# Status values: ready, in_progress, blocked, done.
# A task starts only after all IDs in depends_on are done unless its notes record an
# accepted exception. Keep this file as a repository export even after it is imported
# into the product's own board.

epics:
  - id: FDN
    title: Product and engineering foundation
  - id: CORE
    title: Durable local task and dependency engine
  - id: EXEC
    title: Safe Git workspaces and agent execution
  - id: ORCH
    title: Orchestration, policy, and review
  - id: UX
    title: Usable desktop experience and design validation
  - id: UI
    title: Cohesive desktop visual system
  - id: APP
    title: Local desktop board experience
  - id: LIN
    title: Linear first-class integration
  - id: REL
    title: Reliability and cross-platform release
  - id: QUAL
    title: Code quality, review, and coverage gates

tasks:
  - id: FDN-001
    epic: FDN
    title: Accept the product documentation and delivery contract
    status: done
    priority: P0
    depends_on: []
    acceptance_criteria:
      - Product, architecture, Linear, reliability, roadmap, and ADR documents exist.
      - Future workers have an explicit working agreement and documentation precedence.
    notes: Initial source-of-truth documentation created on 2026-08-08.

  - id: FDN-002
    epic: FDN
    title: Select and record the desktop/runtime technology stack
    status: done
    priority: P0
    depends_on: [FDN-001]
    acceptance_criteria:
      - Desktop shell, UI, local daemon, persistence, PTY, credential storage, and packaging choices are documented in an ADR.
      - The choice is evaluated on macOS, Windows, Linux, local-first operation, and agent adapter needs.
      - The selected TypeScript and Rust tooling can enforce per-package line, statement, function, and branch coverage thresholds of at least 80%.
    notes: Tauri 2, React/TypeScript, Rust, SQLite, Vitest, and cargo-llvm-cov selected in ADR 0005. The desktop bootstrap, icons, per-package coverage gates, and full local verification passed on 2026-08-08.

  - id: CORE-001
    epic: CORE
    title: Define executable domain schemas and state-machine transitions
    status: done
    priority: P0
    depends_on: [FDN-002]
    acceptance_criteria:
      - Project, board, work item, execution, evidence, policy decision, and external-link schemas are versioned.
      - Allowed and disallowed state transitions are unit tested.
      - Done, failed, interrupted, cancelled, and blocked remain distinct states.
    notes: Versioned Rust domain records and the guarded work-item transition state machine were implemented and verified on 2026-08-08. Done requires completion evidence and configured human-review acceptance.

  - id: CORE-002
    epic: CORE
    title: Implement the typed dependency graph and eligibility evaluator
    status: done
    priority: P0
    depends_on: [CORE-001]
    acceptance_criteria:
      - All incoming hard blockers must be satisfied before a task becomes eligible.
      - Cycle insertion is rejected with an actionable explanation.
      - Critical path, upstream/downstream blockers, and safe parallel tasks can be calculated.
    notes: Versioned typed dependencies, hard-cycle validation, explainable eligibility, graph traversal, and dependency-safe parallel-ready task selection were implemented and verified on 2026-08-08. Hard blockers require accepted completion evidence or review acceptance and must name a reason, owner, and next action.

  - id: CORE-003
    epic: CORE
    title: Build durable event persistence and restart reconciliation
    status: done
    priority: P0
    depends_on: [CORE-001]
    acceptance_criteria:
      - Events and materialized state are persisted transactionally.
      - Simulated daemon interruption preserves task history and marks uncertain runs as interrupted.
      - UI reconnect cannot change task state by itself.
    notes: SQLite migrations, append-only versioned events, transactional materialized snapshots, idempotent command handling, and restart reconciliation were implemented and verified on 2026-08-08. Unconfirmed running or awaiting-input work becomes interrupted only through an explicit daemon recovery command; opening the store for a UI reconnect has no task-state side effect. Newer database schemas fail closed to prevent an older app from writing incompatible data.

  - id: EXEC-001
    epic: EXEC
    title: Implement project boundary and safe worktree provisioning
    status: done
    priority: P0
    depends_on: [CORE-001, CORE-003]
    acceptance_criteria:
      - Provisioning is idempotent and recoverable after interruption.
      - An execution is verified to be in its assigned worktree before launch.
      - Base repository mutation and undeclared path access are denied or require a recorded approval.
      - Dependency sharing has explicit strategies; no symlink behavior is forced.
    notes: External Git worktree provisioning, path authorization, and launch verification were implemented and verified on 2026-08-08. The manager validates that the declared project base ref resolves to a commit, derives task branches from it, reuses registered worktrees safely, recovers only an empty interrupted target, rejects root/branch/path conflicts and symlinks, and permits worker access only inside the assigned worktree. Its structured Git boundary also strips inherited repository-context variables and configuration injection, preventing a caller from redirecting worktree or index state. Dependency sharing is explicit and records no forced link behavior.

  - id: EXEC-002
    epic: EXEC
    title: Define and test the agent adapter contract
    status: done
    priority: P0
    depends_on: [CORE-001, CORE-003]
    acceptance_criteria:
      - Capability discovery and normalized lifecycle events are specified.
      - A deterministic fake adapter covers completion, error, approval, interruption, duplicate event, and resume cases.
      - Adapter event input cannot produce an illegal task transition.
    notes: Completed on 2026-08-08 with a provider-neutral Rust lifecycle contract, deterministic fake adapter, ordered event ingestor, and tests proving completion stops at review while errors, interruption, approvals, duplicates, resume, and illegal transitions remain explicit.

  - id: EXEC-003
    epic: EXEC
    title: Add initial Codex CLI, Claude Code, and third-agent adapters
    status: done
    priority: P1
    depends_on: [EXEC-001, EXEC-002]
    acceptance_criteria:
      - Three adapters pass the common conformance suite.
      - Unsupported capabilities are visible before task start.
      - Per-agent session recovery and process-tree cancellation behavior is documented and tested.
    notes: >-
      Completed on 2026-08-08 with three provider-neutral execution profiles: a
      generic structured JSONL bridge, a native Codex CLI wrapper, and a native
      Claude Code wrapper. Each runs without a production shell, receives the
      brief through stdin, converts bounded structured output to safe normalized
      events, and passes one shared non-interactive conformance suite. The desktop
      profile and launch UI show the selected provider and its unavailable
      feedback, session-recovery, and safe process-tree cancellation capabilities
      before start. Codex protocol/sandbox controls and Claude protocol/permission
      controls are adapter-owned and profile validation rejects attempts to
      override them. Resume, interactive feedback, and process-tree cancellation
      remain explicitly unsupported until future provider/platform adapters prove
      them.

  - id: EXEC-004
    epic: EXEC
    title: Add a ClinePass CLI worker adapter
    status: done
    priority: P1
    depends_on: [EXEC-003]
    acceptance_criteria:
      - A ClinePass profile starts Cline's documented JSON event stream from the assigned worktree.
      - Cline account credentials and ClinePass entitlement selection never enter board metadata or SQLite.
      - Provider, credentials, approval, worktree, and protocol options remain adapter-owned and Cline lifecycle events pass the common conformance suite.
    notes: Completed on 2026-08-09 with a dedicated ClinePass CLI profile. It uses the user's separately authenticated Cline account, fixes the Cline provider and noninteractive event/approval flags at the adapter boundary, normalizes only fixed Cline lifecycle summaries and usage, and rejects profile arguments that could supply a key, change billing/provider choice, detach the session, replace the worktree, or weaken the event contract.

  - id: ORCH-001
    epic: ORCH
    title: Implement policy, budget, and approval decisions
    status: done
    priority: P0
    depends_on: [CORE-001, CORE-003, EXEC-001]
    acceptance_criteria:
      - Policies govern tool scope, parallelism, time/cost limits, and protected Git actions.
      - Allow, deny, and approval-required decisions have audit records.
      - The system prevents execution outside policy even when agent prompts conflict.
    notes: Implemented on 2026-08-08. The typed daemon policy gate enforces project and work-item budget limits, returns an opaque execution capability only for allows, records every decision durably, and verifies exact stored Git approvals before it can authorize a protected action.

  - id: ORCH-002
    epic: ORCH
    title: Build plan-preview and daemon-owned dependency scheduler
    status: done
    priority: P0
    depends_on: [CORE-002, EXEC-002, ORCH-001]
    acceptance_criteria:
      - A proposed plan lists tasks, criteria, dependencies, critical path, parallelism, budgets, and unresolved assumptions.
      - User confirmation is required before launch.
      - Scheduling continues correctly while the UI is hidden or disconnected.
    notes: Completed on 2026-08-08 with a provider-neutral daemon scheduling use case. It produces a deterministic typed plan preview, rejects invalid or unconfirmed plans, evaluates hard dependencies from daemon progress, separately defers for repository capacity, and returns only policy-authorized starts. Tests prove scheduling does not require UI state, and ADR 0009 requires durable plan-confirmation persistence when application-level restart-resume is wired. After review feedback, plan validation, scheduling, shared fixtures, and focused test scenarios were split into 14–323-line modules and are protected by the ADR 0010 source-structure gate.

  - id: ORCH-003
    epic: ORCH
    title: Build evidence-first review and recovery flows
    status: done
    priority: P1
    depends_on: [CORE-003, EXEC-001, EXEC-002, ORCH-001]
    acceptance_criteria:
      - Review shows task criteria, diff/commit, checks, agent summary, and decision history.
      - Failure and interruption present retry, inspect, recover, and cancel actions.
      - A task cannot reach done without the configured evidence and approval.
    notes: Completed on 2026-08-08. Board snapshots carry a compact ordered trail of the most recent 20 durable task creation and state-decision events per task, plus bounded recent execution attempts and evidence records. Cards preserve and render agent/session/workspace/usage context, diff/commit evidence, checks, completion reports, and reviewer decisions after reopening. The execution-event controller activates a pending attempt atomically with its session and `Running` task transition, rejects unstarted or out-of-order events, checkpoints usage/status monotonically, and persists input/failure/interruption/completion reports as evidence. The desktop monitors one verified, policy-authorized process per execution independently of the UI; completion moves only to `Review`. Recovery offers attempt inspection, recover-to-Ready/retry, and cancellation. A human-reviewed task cannot reach Done until passing checks, completion report, and a durable accepted review decision all exist.

  - id: ORCH-004
    epic: ORCH
    title: Generate safe plan proposals from natural-language goals
    status: done
    priority: P0
    depends_on: [APP-003, EXEC-003]
    acceptance_criteria:
      - A user can submit a goal and select a provider-neutral planner profile; the planner can produce only one typed, unconfirmed plan proposal for the selected board.
      - Planner I/O is bounded, runs without a production shell, and parses only a strict plan payload; raw provider transcripts, credentials, and arbitrary lifecycle output are not persisted.
      - A malformed, oversized, wrong-board, or invalid planner proposal cannot create or confirm tasks, and returns an actionable error while leaving the board unchanged.
      - The proposal is shown through the existing exact preview and confirmation workflow, including dependencies, critical path, parallel stages, budgets, and assumptions.
    notes: Completed on 2026-08-08 with durable provider-neutral planner profiles, a direct bounded process bridge, strict draft parsing, and daemon-derived plan/task/dependency identity. The UI accepts a goal, shows the existing exact preview, and preserves explicit confirmation as the only task-materialization authority. Planner I/O is capped at 8,000-byte goals, 65,536-byte output, and 45 seconds; raw goals, standard error, and raw provider output are not persisted. A generic profile remains explicitly user-trusted local code rather than a claimed filesystem sandbox; provider-specific sandbox guarantees must be implemented and tested by a dedicated adapter.

  - id: ORCH-005
    epic: ORCH
    title: Ship bounded, opt-in dependency coordination
    status: done
    priority: P0
    depends_on: [ORCH-001, ORCH-003, ORCH-004, EXEC-004]
    acceptance_criteria:
      - The board makes Plan with AI the plain-language entry point and retains the existing typed, unconfirmed plan preview and explicit confirmation gate.
      - You approve actions is the default. Kanban coordinates is an explicit board choice, displays the selected default task worker and a Pause automation action, and does not expose raw commands or credentials.
      - The daemon coordinates only confirmed board work: it moves Inbox work to Planned, promotes work to Ready only when hard dependencies are Done, and starts only one dependency-ready task through the existing policy, workspace, adapter, and execution lifecycle.
      - The coordination path cannot mark a task Done, send Linear updates, bypass protected actions, or weaken existing quality and human-review rules. Worker completion still returns to Review.
      - A rejected review records the decision and returns the task to Ready with its reason, retaining existing evidence and activity history.
      - Tests cover manual non-launch, explicit opt-in and pause, dependency-safe preparation, required inputs, the command bridge, correction handling, and every executable package remains at or above 80% line, statement, function, and branch coverage.
    notes: >-
      Completed on 2026-08-09. This first executable orchestration slice uses a
      manual default and explicit board opt-in, durable dependency preparation,
      and one policy-authorized worker start. The direct user request accepts its
      focused UI scope while UX-004 through UX-006 remain separately planned full
      redesign work; it does not claim those larger tasks are complete.
      Coordination is intentionally not an AI evaluator, retry loop, or automatic
      Done. ADR 0025 records the authority boundary.

  - id: ORCH-006
    epic: ORCH
    title: Complete reviewable AI plan editing and separate organiser selection
    status: done
    priority: P0
    depends_on: [ORCH-005, UX-004, UX-006]
    acceptance_criteria:
      - A person can revise, edit, remove, reorder, and assign a worker to each proposed task before creating the plan.
      - Project settings enables detected installed providers and stores separate, effective defaults for the organiser and new ticket workers: provider, safe model choice, and effort. Those choices are used by the typed plan/worker contracts, survive reopening, and never expose command flags or credentials on the normal path.
      - The plan review replaces opaque task IDs with names everywhere, shows scope and assumptions, and preserves confirmation as the only materialization authority.
      - Tests cover edited/rejected/approved plans, worker reassignment, unavailable providers, and preservation of dependency and confirmation validation.
    notes: >-
      Completed on 2026-08-10 with durable project-scoped organiser and ticket-worker
      defaults, provider-default model handling, effort preference, one-click installed
      worker selection, a non-opaque editable plan review, and typed worker assignments
      that survive reopening. BookCtx — AI Engineering, Chip Huyen, “Planning overview”
      (chunk 26) supports the project-specific inference that plan generation, review,
      and execution must stay separate and retain human confirmation before material
      changes. Provider-native model discovery and argument mapping remain adapter work;
      the normal product path never stores credentials or exposes command flags.

  - id: ORCH-007
    epic: ORCH
    title: Add durable, explainable autonomous worker supervision
    status: done
    priority: P0
    depends_on: [ORCH-005, ORCH-006, UX-005, UX-006]
    acceptance_criteria:
      - Autonomous authority, selected organiser/workers, limits, pause state, and every coordination decision are durable board records owned by the daemon.
      - The organiser receives only normalized state, dependency facts, bounded activity summaries, and evidence. Its recommendation, rationale, policy result, and outcome are visible without storing raw transcripts or credentials.
      - Within explicit policy it can start dependency-ready work and recommend bounded retry or return-for-correction actions; a named user can pause it immediately, and it can never perform automatic Done, provider installation/authentication, protected Git, or external writes.
      - Restart, duplicate events, policy/budget denials, stale decisions, pause, retry, correction, and recovery are covered by daemon and UI tests.
    notes: >-
      Completed on 2026-08-10 with a daemon-owned board-supervision record,
      decision audit, provider-neutral bounded organiser process contract, normalized
      and redacted board context, candidate validation, stale/idempotent/recovery
      handling, durable capacity denials, and an immediate named pause guard.
      The browser reads the daemon state and contains no scheduler timer or
      local-storage authority. BookCtx — AI Agents: The Definitive Guide, Nicole
      Koenigstein, “From LLMs to Agents: The Foundational Blueprint” (chunk 1)
      supports the project-specific bounded-autonomy design of explicit state,
      events, guards, actions, safeguards, and termination.

  - id: ORCH-008
    epic: ORCH
    title: Turn ticket AI prompts into reviewable, daemon-owned task effects
    status: ready
    priority: P0
    depends_on: [ORCH-006, UX-006]
    acceptance_criteria:
      - A ticket-scoped prompt can request every supported ticket action: refine the specification or criteria, request worker guidance, prepare a start or restart, explain evidence, return work for correction, and recover from interruption.
      - Manual mode presents every state-changing or protected result as a named, reviewable user decision; autonomous mode evaluates the same typed request only within recorded authority and policy.
      - The daemon persists the requested effect, rationale, policy result, and outcome while retaining the existing no-bypass boundaries for Done, review, policy, protected Git, and external actions.
      - Prompt I/O is bounded and redacted before persistence; task cards and snapshots expose only safe summaries, never raw transcripts, secrets, or unbounded payloads.
      - Daemon and UI tests cover every effect, rejection, confirmation, cancellation, restart, recovery, policy/budget denial, and the 80% coverage requirement.
    notes: Added 2026-08-09 from the approved wireframe clarification that ticket AI should support all task-relevant requests. Do not substitute a UI-only composer for the typed daemon contract.

  - id: APP-001
    epic: APP
    title: Expose durable local projects, boards, and dependencies through the desktop command boundary
    status: done
    priority: P0
    depends_on: [CORE-001, CORE-002, CORE-003]
    acceptance_criteria:
      - Projects, boards, work items, and typed dependencies persist locally and survive reopening the same database.
      - Project and board creation, board snapshots, work-item creation, state transitions, and dependency insertion are exposed through typed Tauri commands.
      - The command boundary cannot bypass the daemon state machine, board ownership checks, dependency-cycle validation, or evidence requirements.
      - Command and persistence tests cover valid behavior, duplicate identifiers, missing ownership, invalid dependencies, and a reopen scenario.
    notes: Added on 2026-08-08 after the product audit found that the desktop rendered only a foundation card despite the existing domain core. Completed on 2026-08-08 with durable SQLite project, board, work-item, and dependency storage plus typed Tauri commands that remain behind the domain state-machine and validation boundary.

  - id: APP-002
    epic: APP
    title: Build the interactive dependency-aware desktop board
    status: done
    priority: P0
    depends_on: [APP-001]
    acceptance_criteria:
      - A user can create a project, board, and work items; see their states, criteria, budgets, blockers, and typed dependencies after restart.
      - The board clearly separates Ready, active, Review, Done, and recovery work and explains every blocker with reason, owner, and next action.
      - The UI sends commands to the local daemon and never derives authoritative scheduling or state transitions itself.
      - Accessible component tests cover task creation, state-transition feedback, dependency visibility, and error presentation.
    notes: Completed on 2026-08-08 with a Tauri-command-backed React board. Users can create or reopen local boards, create budgeted tasks, submit guarded transitions with completion evidence, manage typed dependencies, see dependency responsibility, and distinguish plan, ready, active, review, done, and recovery work. The board only presents daemon responses; it does not own persistence or state-machine authority.

  - id: APP-003
    epic: APP
    title: Materialize durable, user-confirmed plan proposals through the desktop board
    status: done
    priority: P0
    depends_on: [APP-001, APP-002, ORCH-002]
    acceptance_criteria:
      - A provider-neutral proposal can be submitted for one existing board and is rendered as its exact task, dependency, critical-path, parallel-stage, budget, and assumption preview.
      - Confirmation names a user and time, survives reopening, and atomically creates the proposed tasks and validated dependencies exactly once.
      - A rejected, mismatched, cross-board, duplicate, or already-confirmed proposal cannot partly mutate the board.
      - The desktop clearly distinguishes an unconfirmed preview from a confirmed plan and sends only typed commands to the local daemon.
    notes: Completed on 2026-08-08 with typed desktop commands, a durable SQLite proposal/confirmation record, exact daemon-generated previews, and one atomic materialization transaction. The UI can inspect, revise, cancel, reject, or confirm an unconfirmed proposal; confirmation records identity and time, survives reopening, and is idempotent on retry. Tests cover no partial mutation for mismatched, cross-board, duplicate, collision, and already-confirmed requests. A future provider-neutral orchestrator adapter will generate this same safe proposal contract.

  - id: APP-004
    epic: APP
    title: Let people link a GitHub repository or use an existing local repository
    status: done
    priority: P0
    depends_on: [EXEC-001, UX-008]
    acceptance_criteria:
      - Workspace setup offers equally clear Link a GitHub repository and Use a local repository paths; the former clones to a user-selected local destination and the latter validates an existing repository root through the native picker.
      - The clone path is a typed, safe Git boundary: it visibly identifies the source and destination, uses existing Git credential/SSH configuration without persisting credentials, rejects unsafe destinations, and leaves no partly created project or board after cancellation or failure.
      - The setup copy states that installed provider and agent-role defaults are configured next in project settings; cloning or choosing a repository never triggers an agent, installs a provider, or requests a credential.
      - Command, gateway, and component tests cover local repository selection, successful and failed/cancelled clone preparation, credential non-persistence, recovery messaging, and the 80% coverage requirement.
    notes: >-
      Added on 2026-08-09 from the approved product-owner wireframes. “Link” is
      intentionally a local clone because agent work needs a repository on disk;
      it is not an in-app hosted GitHub browser. Existing Git credential helpers
      remain outside Kanban’s persistence boundary. ORCH-006 owns the later,
      durable project-scoped model, effort, organiser, and worker defaults;
      storing inert UI preferences here would violate the orchestration boundary.
      Completed on 2026-08-09 with a typed GitHub clone command, validated local
      destination, existing Git/SSH credential use, safe cleanup on failure, and
      the revised workspace-first setup flow. The full quality gate passed with
      all frontend and Rust coverage measures above 80%.

  - id: UX-001
    epic: UX
    title: Define the outcome-first desktop experience and acceptance scenarios
    status: done
    priority: P0
    depends_on: [APP-003, ORCH-003, ORCH-004, LIN-003]
    acceptance_criteria:
      - A product UX strategy defines the board library, first-board, returning-user, planning, dependency, recovery, Linear, accessibility, and cross-platform interaction model.
      - It identifies current internal-ID and dense-setup failures, measurable acceptance scenarios, non-goals, and research evidence.
      - Requirements and the roadmap explicitly make recognition-based re-entry, generated IDs, native repository selection, outcome-first planning, and dependency explanation mandatory.
    notes: Completed on 2026-08-09 in docs/product/user-experience.md after repository audit, current Apple/Tauri/Linear documentation research, and targeted BookCtx evidence from User Story Mapping, The Product-Minded Engineer, and Inclusive Design for Accessibility. BookCtx is a globally configured local MCP library, not a project-local dependency.

  - id: UX-002
    epic: UX
    title: Build a durable board library and recognition-based re-entry
    status: done
    priority: P0
    depends_on: [UX-001, UX-008, APP-001]
    acceptance_criteria:
      - The daemon exposes a typed, local board-library query that contains only the metadata required to recognise and safely open a board: display name, repository context, availability, last-opened time, and derived attention summary.
      - The initial desktop screen lists saved boards in deterministic recent-first order and offers a clear Continue action; opening a board never requires a board or project ID.
      - An empty library provides a single clear Set up workspace action. An unavailable repository is diagnosed with a locate/retry path before a board snapshot is loaded.
      - Last-opened state survives restart, stays local, and does not leak repository metadata to providers or Linear. Rust and frontend tests cover empty, recent, unavailable, and reopened-board paths.
    notes: >-
      Keep this as the first implementation PR. Do not combine it with the
      new-board form, graph, or visual refresh; it establishes the small
      authoritative directory contract needed by every later UX slice. UX-002
      proceeded under an earlier delivery exception. The product owner
      subsequently approved an explicit wireframe specification; representative
      validation is now UX-007 rather than a blocker for this completed task.

  - id: UX-003
    epic: UX
    title: Replace ID-driven board setup with a guided repository-first flow
    status: done
    priority: P0
    depends_on: [UX-001, UX-008, UX-002, APP-002]
    acceptance_criteria:
      - The primary create flow asks only for an editable board name and a repository chosen with Tauri's native directory picker; it proposes the repository folder name and validates that the chosen folder is the Git repository root.
      - Project and board IDs are generated by the local command boundary, never typed by a normal user, and are available only in advanced support details.
      - The default base ref and standard policy are displayed as safe defaults. Their overrides are in a collapsed Advanced setup section with clear effect text.
      - Cancelling or failing validation does not persist a partial project/board. A successful creation opens the board home and preserves all existing project-boundary protections.
      - Tests exercise picker cancellation, invalid/non-root repository selection, generated identifiers, default/advanced configuration, and successful creation at the required coverage threshold.
    notes: >-
      Completed on 2026-08-09 in a focused pull request. This work added a
      Tauri capability, migration-safe command changes, and a user-facing form
      replacement. APP-004 now extends this local-only flow with the approved
      GitHub clone path. ORCH-006 owns effective project-scoped agent defaults.

  - id: UX-009
    epic: UX
    title: Make first-board setup one-screen and jargon-free
    status: done
    priority: P0
    depends_on: [UX-003]
    acceptance_criteria:
      - With a project selected, the ordinary desktop setup path presents the project folder, editable board name, Back, and Set up workspace actions without vertical page scrolling at a 720px-tall desktop viewport.
      - The ordinary path never asks the person to understand or choose a base branch, base ref, policy, Standard policy, Git root, or an internal identifier. It explains only the immediate outcome of creating the board.
      - Repository inspection chooses the configured remote's locally known primary branch when available; otherwise it safely prefers an existing conventional primary branch (main, master, or trunk) before falling back to the checked-out branch. Creation revalidates the resolved reference before any durable state changes.
      - A deliberately opened Use a different starting point control is the only initial override. It uses plain language, explains that it is normally unnecessary, and preserves the existing typed base-reference validation. Policy remains daemon-owned and defaults to standard without appearing in this flow.
      - The existing native picker, generated identifiers, atomic creation, no-agent-start guarantee, semantic labels, keyboard access, and all required coverage remain intact. Focused frontend and Rust tests cover the compact default path, intentional override, and primary-branch resolution.
    notes: >-
      Completed on 2026-08-09 in a focused pull request. BookCtx — The
      Product-Minded Engineer, "Turn Unknown Unknowns into Known Unknowns" and
      "Interaction Design" supported removing implementation vocabulary from
      the green path, providing a safe predictable default, and making the less
      common override intentional. ADR 0023 supersedes the setup-default
      portions of ADR 0020. The full quality gate passed with every frontend and
      Rust coverage metric above 80%; the review receipt is
      docs/quality/reviews/UX-009-one-screen-first-board-setup.yaml.

  - id: UX-010
    epic: UX
    title: Keep board opening recoverable when optional local state is absent
    status: done
    priority: P0
    depends_on: [UX-002, UX-009]
    acceptance_criteria:
      - Opening a saved board with no stored plan shows its normal outcome-planning entry state; it never renders a blank screen.
      - The Tauri adapter normalises an absent optional plan from its JSON null representation to the frontend's explicit absent state.
      - An unexpected workspace render failure presents a semantic recovery message and Try again action, stating that durable board data was not changed.
      - Focused adapter and recovery-boundary tests reproduce the null-response case and prove visible recovery. The full quality gate and every coverage metric remain at or above 80%.
    notes: >-
      Completed on 2026-08-09 from live usability testing. Selecting a saved
      project and continuing exposed a JSON-null optional plan at the typed
      command boundary; the unnormalised value caused the PlanPreview component
      to throw and React removed the workspace. The Tauri adapter now normalises
      that absence and a tested workspace error boundary presents recovery rather
      than a blank screen. The full quality gate passed with every coverage
      metric above 80%; the review receipt is
      docs/quality/reviews/UX-010-no-blank-board-opening.yaml.

  - id: UI-001
    epic: UI
    title: Establish a polished shadcn visual system across the desktop board
    status: done
    priority: P0
    depends_on: [UX-001, UX-002, UX-003, APP-003]
    acceptance_criteria:
