  - id: UX-011
    epic: UX
    title: Focus the Kanban board and simplify installed-agent setup
    status: done
    priority: P0
    depends_on: [UX-001, EXEC-004]
    acceptance_criteria:
      - The default board surface contains only delivery-relevant columns, concise task cards, dependency/attention signals, and clear actions to plan work, add a task, or open settings. It does not embed planner, provider, dependency-editor, or Linear configuration forms.
