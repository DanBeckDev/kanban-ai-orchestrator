remediation:
  - finding: The desktop rendered static metadata and had no durable command boundary for product work.
    change: Added a focused board application service, SQLite board repository, migration, typed Tauri commands, and reopen coverage while preserving the domain state machine as the only transition authority.
  - finding: The desktop state mutex could become an accidental external-I/O lock.
    change: Restricted command handlers to synchronous local SQLite use cases; the architecture decision explicitly prohibits holding the lock around agents or network requests.
