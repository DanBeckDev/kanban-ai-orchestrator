review:
  skill: clean-code-review
  reviewer: codex
  reviewed_at: 2026-08-09T01:50:18Z
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: "Cline's non-TTY mode denies tool calls when approval is required, while a background worker must be able to act inside its policy-authorized worktree."
        resolution: accepted
        rationale: "The adapter fixes Cline's documented noninteractive approval option rather than allowing profiles to override it. The existing desktop launch policy, assigned-worktree boundary, evidence gates, and human review remain authoritative; release evidence must verify the real profile on each distributed platform."
        decision_reference: ADR-0013 and docs/quality/platform-release.md
      - finding: "ClinePass selection and account authentication are external Cline state rather than a board setting."
        resolution: accepted
        rationale: "Keeping account tokens, API keys, subscription state, and model entitlement out of SQLite prevents a provider credential from becoming board metadata. The user chooses the ClinePass model through Cline's authenticated configuration."
        decision_reference: docs/integrations/cline-pass.md
  unresolved_actionable_findings: 0
remediation:
  - finding: "Adding a third native wrapper would repeat the same AgentAdapter lifecycle delegation and make future provider additions rigid."
    change: "Replaced provider-specific wrappers with one NativeProcessAdapter; a single composition-boundary switch selects the provider's fixed arguments and event protocol."
  - finding: "A Cline profile could otherwise supply provider, credential, approval, detached-session, worktree, or native-protocol options from SQLite-backed profile arguments."
    change: "Added ClinePass profile validation that reserves those controls, then fixed the Cline provider, JSON output, and noninteractive approval flags in the adapter."
  - finding: "Raw Cline agent text, tool content, and account-related output could become durable board activity."
    change: "Added a bounded Cline agent_event decoder that persists only fixed activity/failure/completion summaries and numeric usage totals, with redaction regression tests."
  - finding: "Provider decoder behavior and its growing test scenarios were vertically co-located."
    change: "Moved decoder tests to a focused companion module, leaving the production decoder below the source-structure limit and dedicated to normalization."
