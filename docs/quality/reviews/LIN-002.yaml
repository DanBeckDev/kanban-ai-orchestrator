remediation:
  - finding: The import use case described an immutable Linear UUID but only accepted any nonblank string.
    change: Added UUID parsing at the Rust application boundary, including a rejection test that verifies no invalid link is written.
  - finding: An arbitrary URL could be durably stored and later opened by the board UI.
    change: Accepted only HTTPS linear.app URLs at the authoritative boundary; the form now also gives the browser URL semantics.
  - finding: A newly rendered task-select option made an existing text-only UI assertion ambiguous.
    change: Scoped the assertion to the task heading so it verifies the intended card rather than incidental text anywhere on the page.
