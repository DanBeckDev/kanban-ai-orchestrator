review:
  skill: clean-code-review
  reviewer: codex
  reviewed_at: 2026-08-08T19:54:21Z
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: The production GraphQL transport is a deliberately thin external HTTP boundary and cannot be deterministically exercised against Linear from unit tests.
        resolution: not-applicable
        rationale: The request contract, response validation, error propagation, and read-only bounded query are tested through an injected transport. A live OAuth/Linear verification remains a user-owned end-to-end step and is not substituted with a flaky network unit test.
        decision_reference: LIN-001
  unresolved_actionable_findings: 0
remediation:
  - finding: The import use case described an immutable Linear UUID but only accepted any nonblank string.
    change: Added UUID parsing at the Rust application boundary, including a rejection test that verifies no invalid link is written.
  - finding: An arbitrary URL could be durably stored and later opened by the board UI.
    change: Accepted only HTTPS linear.app URLs at the authoritative boundary; the form now also gives the browser URL semantics.
  - finding: A newly rendered task-select option made an existing text-only UI assertion ambiguous.
    change: Scoped the assertion to the task heading so it verifies the intended card rather than incidental text anywhere on the page.
  - finding: Refreshing an access token in the desktop command could have kept the shared OAuth mutex locked during network I/O.
    change: Split credential selection from token resolution, then persist a refreshed credential only after the HTTP operation returns; the shared mutex now protects local state only.
  - finding: GraphQL responses and transport errors needed an explicit boundary before they reached the board UI.
    change: Added a bounded, read-only assigned-issues query behind an injectable transport and validate GraphQL errors, missing data, invalid JSON, and incomplete issue summaries before returning them.
  - finding: OAuth callback tests grew beyond the 400-meaningful-line hard limit while adding security and failure coverage.
    change: The whole-repository structure gate stopped the change at 408 lines; callback-specific tests were split into a focused submodule with no exception.
  - finding: Full verification reported an immutable test fixture as a lint warning.
    change: Changed the fixture binding to const and reran the full suite with no warnings.
