review:
  skill: clean-code-review
  reviewer: codex
  reviewed_at: 2026-08-09T01:05:43Z
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric:
      - finding: "The first implementation updated an outbox state after reading it without a database state predicate, which would not be a compare-and-swap transition across store instances."
      - finding: "A final source scan found types.ts at 401 meaningful lines and OAuth tests at 422 meaningful lines."
      - finding: "Initial Rust coverage fell below the mandatory branch and statement floor after the connector additions."
      - finding: "The read-only and targeted-comment OAuth commands duplicated authorization browser/callback workflow code."
    considers:
      - finding: "Ambiguous externally visible comment writes are intentionally not automatically retried."
        resolution: accepted
        rationale: "A timeout cannot prove that Linear rejected the mutation; marking the durable item delivery_uncertain avoids duplicate external comments and leaves the decision visible to the user."
        decision_reference: ADR-0018
      - finding: "The first-class Linear alpha does not automatically write statuses, create issues, or poll Linear."
        resolution: accepted
        rationale: "The shipped capability is explicitly user-triggered refresh and manually sent comments with the minimum OAuth scope; broader remote authority remains a separately tracked opt-in capability."
        decision_reference: ADR-0018
  unresolved_actionable_findings: 0
remediation:
  - finding: "The first implementation updated an outbox state after reading it without a database state predicate."
    change: "Changed claim, delivery completion, and restart recovery to use guarded UPDATE predicates against the expected current state; a competing transition now fails closed."
  - finding: "The full source scan found a 401-line frontend types module and a 422-line OAuth test module."
    change: "Moved the board gateway contract to boardGateway.ts, isolated Linear workspace fixtures, and moved OAuth comment-scope coverage into a focused child test module. All source files are at or below 400 meaningful lines."
  - finding: "Initial Rust coverage fell below the mandatory branch and statement floor."
    change: "Added behavior tests for conflict keys, invalid link ownership, direct uncertain delivery, all shared fields, shared-field error responses, and both accepted comment permissions."
  - finding: "OAuth commands duplicated browser/callback authorization orchestration."
    change: "Extracted one begin_linear_authorization helper so read-only OAuth and targeted-comment reauthorization share the same secure callback lifecycle."
