  reviewed_at: 2026-08-10T02:54:08Z
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: "The Linear hook coordinates connection status, assigned issues, and connector commands."
        resolution: accepted
        rationale: "These operations share one user-facing connector actor, one busy/error boundary, and request-order protection; splitting them would duplicate invalidation logic and blur the gateway boundary."
        decision_reference: ADR-0029
  unresolved_actionable_findings: 0
remediation:
  - finding: "BoardWorkspace had accumulated Linear-specific state and asynchronous command details beyond its board-composition responsibility."
    change: "Extracted the cohesive useLinearBoardConnection hook, returning BoardWorkspace to a focused composition boundary."
  - finding: "Older status or assigned-issue responses could overwrite a newer connection or load request."
    change: "Added monotonic request identifiers with focused out-of-order-response tests."
  - finding: "Disconnected copy could call a board local-only even when it retained existing local Linear links."
    change: "Made unavailable and disconnected guidance describe only verified state, preserving existing links and naming the next action."
