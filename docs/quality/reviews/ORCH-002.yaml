  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: The pure scheduler holds its accepted confirmation in process memory.
        resolution: accepted
        rationale: The use case deliberately has no SQLite, UI, or agent-provider dependency so scheduling can be tested at the application boundary. ADR 0009 requires the application daemon to persist an accepted plan and confirmation before it offers restart-resume for planned work.
        decision_reference: ADR-0009
  unresolved_actionable_findings: 0
remediation:
  - finding: Repository capacity was implicit in policy parallelism.
    change: Added an explicit repository-capacity input and explainable capacity deferrals before policy authorization.
  - finding: Blank or reused policy-decision identifiers could make audit identity ambiguous.
    change: Validated every candidate decision identifier before any audit write or authorization.
  - finding: Several tests combined independent actions.
    change: Split invalid-confirmation, malformed-decision, and proposal-validation scenarios into independently named tests.
  - finding: Clippy reported an opaque conditional chain in the budget summary.
    change: Replaced it with an explicit if/else branch.
