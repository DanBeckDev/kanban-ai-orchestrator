review:
  skill: clean-code-review
  reviewer: codex
  reviewed_at: 2026-08-08T18:30:00Z
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: An agent event updates a work-item event, evidence record, and execution checkpoint in separate short SQLite transactions.
        resolution: accepted
        rationale: Each write has a deterministic execution-and-sequence identifier and is idempotent on retry, so a process crash can replay incomplete work without holding a database lock across adapter I/O. A single long transaction would violate the daemon's no-external-I/O-under-lock boundary.
        decision_reference: ORCH-003
  unresolved_actionable_findings: 0
remediation:
  - finding: The board showed current state but did not let a reviewer inspect the durable decision trail that produced it.
    change: Added ordered activity entries derived from append-only events to the board snapshot and rendered them per card with timing and completion evidence.
  - finding: Current-state data and activity-history projection would otherwise be mixed into the board service.
    change: Kept the snapshot/activity projection in a focused application module and made persistence collect and globally order only the board's task events.
  - finding: Loading every historical event for every card could grow without bound and degrade a busy board.
    change: Added a focused recent-event query and bounded board snapshots to the latest 20 events per task; a direct persistence test proves the query returns chronological recent events without truncating the full append-only history.
  - finding: The board's advisory recovery menu had drifted from the daemon state machine.
    change: Matched every displayed transition option to the guarded Rust lifecycle and added recovery-transition assertions.
  - finding: The local quality command relied on an incremental source-structure scan, which could omit an untracked or unchanged oversized source file.
    change: Made the local gate run the whole-repository structural scan, made the incremental scanner include untracked source, and added a unit test for that path union.
  - finding: Agent attempts and review artifacts could not survive a restart or be reviewed from the board.
    change: Added migration-backed execution and evidence persistence, bounded board projections, typed Tauri commands, restart and snapshot tests, and card sections for recent attempts and evidence.
  - finding: A worker update could otherwise rewrite execution identity, session identity, usage, event sequence, or lifecycle state without a guard.
    change: Made identity immutable and accepted only monotonic usage/sequence/session progress and valid execution-state transitions; focused tests cover accepted progress and each rejected mutation class.
  - finding: Adding new command DTOs left the board service at 398 meaningful lines, risking a future breach of the repository limit.
    change: Moved boundary request DTOs into a focused application module, reducing the service to 337 meaningful lines while keeping the command vocabulary explicit.
  - finding: Normalized agent events could be displayed or stored without a durable, ordered execution checkpoint, allowing a provider claim to drift from task state after restart.
    change: Added a focused execution-event controller that activates only a pending execution with a nonblank session, validates event order, maps every state request through the guarded state machine, stores monotonic usage/status, and preserves significant agent reports as evidence.
  - finding: A repeated review report for an already-reviewing task would be treated as an illegal state transition rather than retained as additional evidence.
    change: Made a requested state equal to the current state a no-op in the event ingestor while still advancing the validated sequence and storing the report.
  - finding: A low-level update could set an execution to running without an attached agent session.
    change: Added the storage invariant that Pending to Running requires a nonblank attached session, with focused persistence coverage.
  - finding: Usage-event semantics could be interpreted as deltas, which would make a later valid adapter update look like a decrease and be rejected.
    change: Specified cumulative usage checkpoints in the normalized adapter contract and added controller coverage for distinct failed and interrupted reports.
