remediation:
  - finding: The board showed current state but did not let a reviewer inspect the durable decision trail that produced it.
    change: Added ordered activity entries derived from append-only events to the board snapshot and rendered them per card with timing and completion evidence.
  - finding: Current-state data and activity-history projection would otherwise be mixed into the board service.
    change: Kept the snapshot/activity projection in a focused application module and made persistence collect and globally order only the board's task events.
  - finding: Loading every historical event for every card could grow without bound and degrade a busy board.
    change: Added a focused recent-event query and bounded board snapshots to the latest 20 events per task; a direct persistence test proves the query returns chronological recent events without truncating the full append-only history.
  - finding: The board's advisory recovery menu had drifted from the daemon state machine.
    change: Matched every displayed transition option to the guarded Rust lifecycle and added recovery-transition assertions.
  - finding: The local quality command relied on an incremental source-structure scan, which could omit an untracked or unchanged oversized source file.
    change: Made the local gate run the whole-repository structural scan, made the incremental scanner include untracked source, and added a unit test for that path union.
