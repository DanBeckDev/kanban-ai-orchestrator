remediation:
  - finding: Direct local workers needed a durable provider-neutral profile and a runtime that could continue independently of the React window.
    change: Added validated SQLite-backed direct-program profiles, typed desktop commands, a dedicated process monitor, bounded normalized events, and a board polling projection. The runtime keeps database locks narrow and never holds one across Git or process I/O.
  - finding: Attaching an agent session and showing a task as Running in separate writes could leave durable task and execution state inconsistent after a failure.
    change: Added one SQLite transaction that updates the pending execution, appends the Running task event, and materializes the task snapshot; a rollback test proves that a failed event write does not attach the session.
  - finding: The launch path could provision a worktree and start an executable without the existing policy gate recording an authorization decision.
    change: Added a focused policy-start service and project-wide active-execution count. The desktop MVP recognizes the documented standard policy, records allow and deny decisions before provisioning, and refuses a second active project execution or an unsupported policy set before any worktree/process side effect.
  - finding: A generic process profile that reported awaiting input could be terminated while the board continued to display an interactive Awaiting Input state.
    change: The monitor now records the input request, then records a clear failed report and terminates the direct child because this profile explicitly has no feedback/resume capability. The end-to-end test proves the task and execution become Failed rather than falsely waiting.
  - finding: The general transition form and legacy raw desktop IPC commands could manufacture agent-owned execution state without a live worker.
    change: Removed raw execution/evidence update commands from the desktop gateway, removed Running and Awaiting Input from manual transition choices, and made the remaining IPC command reject both states. Only the audited runtime activation and normalized agent events may enter them.
  - finding: The runtime registration error returned a large tuple containing a live process adapter, and the launch preflight passed an unnecessary reference layer.
    change: Made live-agent registration own child cleanup on its failure path and simplified the workspace preflight reference; strict clippy now passes with warnings denied.
