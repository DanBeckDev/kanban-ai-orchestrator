remediation:
  - finding: A completed worker entered Review without durable Git commit or diff evidence for a reviewer to inspect.
    change: Collected verified-worktree commit and bounded diff statistics after each terminal worker event, including staged changes, and recorded them as typed evidence. Dedicated runtime evidence-mapping and workspace tests cover committed and staged output.
  - finding: A reviewer could claim checks or a completion report existed while moving a card to Done without matching durable records.
    change: Added a review-only check command and application-boundary validation that requires a recorded passing Check and recorded CompletionReport for the same work item before Done can be persisted.
  - finding: A live direct worker could be visually cancelled through a generic state transition without stopping its process.
    change: Replaced active-card cancellation with a direct-process stop request that records an Interrupted attempt; the Recovery column now supplies explicit inspection, recover-to-Ready/retry, and cancellation actions.
  - finding: Focused board and workspace test modules exceeded the repository's 400-meaningful-line source limit while adding review and Git-artifact coverage.
    change: Extracted cohesive board fixtures and review-artifact scenarios into dedicated test modules. The whole-repository structural scan now passes with no exceptions.
  - finding: The asynchronous worker review test used a fixed one-second polling window and failed under coverage instrumentation despite the worker eventually completing.
    change: Replaced the attempt-count timeout with a monotonic five-second deadline, retaining fast polling while making the assertion reliable under the slower coverage build.
