review:
  skill: clean-code-review
  reviewer: codex
  reviewed_at: 2026-08-08T22:52:00+01:00
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: A generic configured planner executable is local user-trusted code rather than a cross-platform filesystem sandbox.
        resolution: accepted
        rationale: The narrow direct-process bridge keeps provider policy out of the core, accurately documents the trust boundary, and never claims read-only or process-tree guarantees it cannot prove. A provider-specific sandbox is an adapter extension, not an invisible safety assumption.
        decision_reference: ADR-0015
      - finding: Planner output is read on one short-lived thread while the command boundary polls the direct child.
        resolution: accepted
        rationale: The concurrency mechanics are isolated in the process-edge module, use no shared mutable application data, bound output and lifetime, terminate the child on every reader/wait failure, and leave the board-service lock before I/O.
        decision_reference: ADR-0015
  unresolved_actionable_findings: 0
remediation:
  - finding: The initial strict planner payload still permitted unknown fields nested in a reused budget DTO.
    change: Added a planner-specific strict budget payload and a one-way conversion into the domain budget, with an unknown-field regression test.
  - finding: A direct-child wait error could return before terminating the planner process.
    change: Terminate and reap the child before returning the process-wait error.
  - finding: Planner-profile save or goal-generation failure could lose form input or leave the user without local feedback.
    change: Preserve input and show form-local actionable errors; the board remains unchanged until explicit confirmation.
  - finding: New planner validation and process branches reduced Rust branch coverage below the required threshold.
    change: Added tests for profile nulls, all draft limits, blank facts, blank and oversized goals, unavailable programs, failed planner processes, and deterministic child timeouts without lowering thresholds.
