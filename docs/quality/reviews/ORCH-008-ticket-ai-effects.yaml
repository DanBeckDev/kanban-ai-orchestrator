review:
  skill: clean-code-review
  reviewer: codex
  reviewed_at: 2026-08-10T02:49:00+01:00
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: "The ticket-effect gate remains held while a bounded organiser process prepares one effect."
        resolution: accepted
        rationale: "It makes a request ID idempotent across the only untrusted process boundary and does not cover worker execution; task effects, application service, process adapter, and UI composition are already separated by actor."
        decision_reference: ADR-0027
  unresolved_actionable_findings: 0
remediation:
  - finding: "A manual refinement could be applied from the task-AI history without showing the proposed title, details, and success checks."
    change: "Rendered every proposed refinement field before the named Apply decision and added a UI test."
  - finding: "Ticket-effect persistence and organiser error branches lacked enough focused safety coverage to preserve the repository coverage gate."
    change: "Added immutable-audit transition coverage and safe bounded-process error coverage rather than weakening the 80 percent threshold."
  - finding: "Task-AI UI work risked enlarging the board workflow component."
    change: "Extracted TaskDetailView and ticket-effect fixtures and operations into focused modules."
