review:
  skill: clean-code-review
  reviewer: codex-gpt-5.6
  reviewed_at: 2026-08-10T10:08:00+01:00
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: "The live catalogue remains short-lived UI state instead of a durable provider-model cache."
        resolution: accepted
        rationale: "Provider accounts can change independently. ADR-0031 keeps this credential-derived adapter data out of boards, SQLite, worktrees, and logs; refresh is explicit."
        decision_reference: ADR-0031
      - finding: "An account catalogue is advisory; native execution remains the authority for whether a selected model can actually run."
        resolution: accepted
        rationale: "The documented account APIs expose different capability detail, while the existing native adapter retains all execution, policy, confirmation, review, and Done gates."
        decision_reference: ADR-0031
  unresolved_actionable_findings: 0
remediation:
  - finding: "The old split form asked people to choose a provider in one place and enter model identifiers in another."
    change: "Replaced it with one self-contained shadcn card per provider, role toggles, catalogue dropdowns, effort controls, and a single save action."
  - finding: "An asynchronous catalogue refresh could freeze unrelated Settings controls."
    change: "Moved loading state into the affected provider card and kept role selection and saving responsive."
  - finding: "A catalogue request could run indefinitely or return only the first Anthropic page."
    change: "Added a 15-second request deadline and bounded 100-model Anthropic pagination with safe cursors and duplicate normalization."
  - finding: "A credential could be persisted before proving that the provider could return a usable catalogue."
    change: "The service validates and retrieves a ready catalogue before storing the key in the OS keychain; failures retain no new credential."
  - finding: "A legacy saved model absent from the latest account list could leave the selector without a valid visible value."
    change: "The selector preserves it visibly with a clear warning and directs the person to refresh or choose another model."
