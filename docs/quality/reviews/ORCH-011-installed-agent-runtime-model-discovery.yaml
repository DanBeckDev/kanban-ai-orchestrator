review:
  skill: clean-code-review
  reviewer: codex-gpt-5.6
  reviewed_at: 2026-08-10T10:37:00+01:00
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: "Claude Code and Cline currently return Use provider default until their supported local SDK/client APIs expose the same catalogue capability."
        resolution: accepted
        rationale: "ADR-0032 rejects guessed model lists and duplicate authentication. The provider-neutral port allows a future official adapter without changing board state, Settings contracts, or execution policy."
        decision_reference: ADR-0032
  unresolved_actionable_findings: 0
remediation:
  - finding: "The prior model-list implementation duplicated account configuration with direct provider REST calls and API-key persistence."
    change: "Removed the credential command, keychain store, direct provider transports, and every API-key control. Provider cards now use only the installed local runtime."
  - finding: "A model list could promise an effort level that the native execution adapter cannot send."
    change: "The Codex adapter exposes only low, medium, and high levels that the existing neutral effort contract can translate, rather than relabelling xhigh, max, or ultra."
  - finding: "Runtime protocol notifications could accumulate while waiting for a model response."
    change: "The focused reader thread filters non-response notifications before the request channel, uses only local state, has a five-second response bound, and is terminated after the catalogue response."
  - finding: "Provider models and supported efforts needed a repeatable integration test without a real signed-in account."
    change: "Added a deterministic process fixture that validates the full JSON-RPC initialise, initialized, and model/list exchange, alongside model mapping and fallback tests."
