review:
  skill: clean-code-review
  reviewer: codex
  reviewed_at: 2026-08-10T11:32:00+01:00
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric:
      - finding: "The full frontend coverage suite timed out interaction tests when every available CPU was used for separate jsdom workers."
        remediation: "Bound Vitest to four workers while retaining file parallelism; the full 44-file coverage suite then passed."
    considers:
      - finding: "Claude Code's local CLI advertises aliases and effort tokens rather than an account-specific model catalogue."
        resolution: accepted
        rationale: "The adapter labels these as locally supplied runtime options and leaves final entitlement validation to the signed-in Claude Code runtime; it never invents an account catalogue or adds a second API connection."
        decision_reference: ADR-0033
      - finding: "The installed-runtime module was separated into a dispatch module and provider-specific process/protocol modules."
        resolution: implemented
        rationale: "The split keeps vendor protocol and thread/process mechanics out of the shared provider-neutral dispatch boundary, with no source file approaching the 400-line limit."
        decision_reference: ADR-0032
  unresolved_actionable_findings: 0
remediation:
  - finding: "Claude Code rendered an empty model selector despite its installed CLI advertising selectable aliases and effort values."
    change: "Added a bounded read-only Claude CLI capability adapter, persisted its complete effort scale, and hid model/effort selectors whenever a provider cannot supply choices."
  - finding: "Codex capability parsing previously discarded its higher native effort values."
    change: "Preserved xhigh, max, and ultra through the neutral preference and native adapter boundary."
