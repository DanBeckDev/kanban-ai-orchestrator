review:
  skill: clean-code-review
  reviewer: codex-gpt-5.6
  reviewed_at: 2026-08-10T12:23:00+01:00
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: "Cline's installed catalogue can be unavailable for a direct binary or custom launcher that does not expose its published Node package layout."
        resolution: accepted
        rationale: "ADR-0034 requires a truthful unavailable state instead of a guessed list or direct credential/config-file access. A future documented Cline local protocol can become a separate adapter."
        decision_reference: ADR-0034
      - finding: "Cline's catalogue query and Claude help query both need child-process output limits and cleanup."
        resolution: implemented
        rationale: "The shared bounded-output module centralizes non-interactive stdin, discarded stderr, stdout limits, timeout polling, and child cleanup without combining provider-specific protocol parsing."
        decision_reference: ORCH-013
      - finding: "A historical saved Cline Maximum or Ultra setting cannot be represented by Cline's documented thinking levels."
        resolution: implemented
        rationale: "The settings catalogue omits those choices for Cline and native planner/worker launch validates and rejects stale values before starting a process."
        decision_reference: ADR-0034
  unresolved_actionable_findings: 0
remediation:
  - finding: "The Cline card fell back to provider default despite Cline's installed SDK exposing model metadata."
    change: "Added a fixed, bounded Cline SDK/Core catalogue adapter that returns only model identifiers, labels, and reasoning support to the existing provider-neutral contract."
  - finding: "Native Cline execution could receive a stale effort value the CLI does not support."
    change: "Mapped only Cline's documented four thinking levels and rejected Maximum or Ultra before planner or worker process launch."
  - finding: "Claude Code and Cline duplicated bounded local child-process handling."
    change: "Extracted the shared non-interactive bounded-output runner, retaining provider-specific parsing modules."
