remediation:
  - finding: "The release policy could incorrectly imply that every platform-specific native capability is automated in generic CI."
    change: "Separated the portable core matrix from explicit target-platform evidence for packaging, credentials, provider lifecycle, signing, and notarization."
  - finding: "Windows rejected the POSIX-only file URL used by three script tests."
    change: "Extracted one root-resolution helper and changed each test to construct a platform-native file URL."
  - finding: "Windows Git rejected canonical verbatim paths when creating or attaching a worktree."
    change: "Translated only Git process arguments from verbatim disk and UNC paths, retained canonical paths for authorization comparisons, and isolated the Git tests from the production adapter. The adapter now recognizes the literal Windows verbatim marker before Windows Path parsing can normalize it away."
