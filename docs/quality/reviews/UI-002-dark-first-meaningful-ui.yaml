remediation:
  - finding: "The first library-load failure exposed a raw local invocation error and redundant technical alert."
    change: "Replaced it with one outcome-led recovery state and suppressed the duplicate raw error on first load."
  - finding: "Recognised-board actions were exposed as the ambiguous label Continue."
    change: "Used a visible Open board action and accessible names that identify the board or retry target."
  - finding: "New and existing source-owned primitives used broad transition-all animation."
    change: "Replaced it with the exact colour, background, border, shadow, and transform properties each primitive changes."
  - finding: "Theme validation was duplicated between the preference boundary and the selector."
    change: "Exported one validated theme type guard from the preference boundary and reused it in the selector."
  - finding: "The shadcn-generated toggle source imported types as runtime values."
    change: "Converted those imports to type-only imports and reran the lint gate with no warnings."
