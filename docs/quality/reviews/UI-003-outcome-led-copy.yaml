review:
  skill: clean-code-review
  reviewer: codex-gpt-5.6
  reviewed_at: 2026-08-10T02:17:10Z
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: "ProjectAgentDefaultsForm is 347 meaningful lines because the two user-facing roles share one save contract and installed-provider action."
        resolution: accepted
        rationale: "Splitting the role preference fields would duplicate or obscure the single project-default save boundary; the model normalization and role DTO construction remain small named helpers."
        decision_reference: ADR-0028
  unresolved_actionable_findings: 0
remediation:
  - finding: "GitHub linking, provider-default model choice, and generic retry labels did not name the user's actual action or outcome."
    change: "Replaced them with explicit clone/local choices, separately persisted model and effort preferences for both roles, and named reload/check actions."
  - finding: "Normal workflow states exposed raw local-service, provider, and connector error messages."
    change: "Mapped them to safe, actionable copy while keeping precise JSON and advanced configuration guidance where the user can correct input."
  - finding: "Several changed native form fields lacked the standard name and autocomplete metadata required for accessible, predictable form handling."
    change: "Added meaningful names and appropriate autocomplete values, then reran the Web Interface Guidelines audit of changed UI code."
  - finding: "The role-default save request was duplicated between form submission and installed-provider selection."
    change: "Extracted one named saveDefaults helper so both paths persist the same role contract."
