remediation:
  - finding: "The board-library timestamp is serialized by Rust as nullable, while the frontend treated it as an omitted optional value and could render a Unix-epoch date."
    change: "Modelled the timestamp explicitly as string-or-null and added a never-opened board test."
  - finding: "Board opening duplicated repository-availability logic already used by board listing."
    change: "Reused the shared availability predicate so listing and opening enforce the same local-folder rule."
  - finding: "The general board-workspace test file exceeded the 400 meaningful-line structural limit after adding library coverage."
    change: "Moved library journeys into a focused BoardWorkspace.library.test.tsx suite."
