remediation:
  - finding: "The normal setup card made a person scroll through branch and policy controls, including unexplained internal terminology."
    change: "Reduced the normal path to project folder, board name, and meaningful outcome copy; the policy is now an internal standard default and the only optional control is a closed plain-language starting-point override."
  - finding: "Repository inspection used the checked-out branch, so a feature worktree could be shown as the recommended base."
    change: "Added a focused resolver that uses a locally known remote default first, then conventional primary branches, and only then the checked-out branch; tests cover each safe fallback stage."
  - finding: "The initial resolver extension made the generic Git command module exceed the 400 meaningful-line limit."
    change: "Moved the independent resolver to repository_branch.rs, retained narrowly scoped module visibility for generic command helpers, and kept every changed source file below the zero-exception limit."
  - finding: "The new resolver initially left overall Rust branch coverage at 79.98%."
    change: "Added meaningful remote-primary and checked-out-branch fallback cases; Rust branch coverage is now above the required threshold."
