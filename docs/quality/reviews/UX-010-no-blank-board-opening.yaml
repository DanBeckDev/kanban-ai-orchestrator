remediation:
  - finding: "Tauri serialises Rust Option::None as JSON null, while the frontend BoardGateway contract represents an absent plan as undefined."
    change: "Normalised the board_plan response at the gateway boundary before it can enter UI state; a saved board without a plan now follows the ordinary outcome-planning path."
  - finding: "An uncaught React child-render error removed the workspace with no recovery interface."
    change: "Wrapped the workspace with a focused error boundary that states durable data is unchanged and provides a retry action."
  - finding: "The initial recovery title was not a semantic heading."
    change: "Added an explicit level-two heading role and a focused accessibility assertion before completion."
