review:
  skill: clean-code-review
  reviewer: codex-gpt-5.6
  reviewed_at: 2026-08-09T13:27:00+01:00
  findings:
    must_fix: []
    should_fix: []
    outside_clean_code_rubric: []
    considers:
      - finding: "A full visual dependency graph remains planned rather than included in this focused-board slice."
        resolution: accepted
        rationale: "Named hard blockers on compact cards and full keyboard-accessible dependency detail are implemented now; ADR 0024 and UX-005 retain the graph as a separate accessible outcome."
        decision_reference: ADR-0024-and-UX-005
  unresolved_actionable_findings: 0
remediation:
  - finding: "The old board mixed planning, provider, Linear, dependency, and execution controls with every task column."
    change: "Split it into BoardCanvas, BoardManagement, BoardSettings, Plan work, and Task detail surfaces."
  - finding: "A person had to enter an opaque task ID and card blockers did not name their upstream work."
    change: "Task creation now derives an internal ID from title and timestamp; compact cards name the first upstream hard blocker."
  - finding: "Choosing a provider could select it even if profile persistence failed."
    change: "Profile persistence returns an explicit success result; the default changes only after success, with a focused regression test."
  - finding: "Executable existence alone could mark a non-executable file as an installed local agent on Unix."
    change: "Provider discovery checks the executable bit, with a native regression test, while never launching a provider."
  - finding: "Changed cards used generic div titles in the document outline."
    change: "The source-owned card primitive now permits explicit h3 or h4 titles; board, setup, library, and task card uses choose their correct level."
