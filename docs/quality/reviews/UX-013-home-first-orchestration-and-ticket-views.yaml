remediation:
  - finding: "The combined board screen mixed outcome planning, delivery state, automation, and ticket lanes, making the primary user journey unclear."
    change: "Separated Home, Tickets, Dependencies, and Settings surfaces; Home is now the default outcome-and-observation workspace and Tickets retains only delivery work."
  - finding: "Planner progress was not available through the same bounded observable activity boundary used by ticket workers."
    change: "Added a separate planner activity stream that records only normalised lifecycle events, keeps terminal outcomes available, and is displayed on Home."
  - finding: "A failed planner request could finish before Home rendered its useful terminal activity, leaving no explanation in the activity panel."
    change: "Retained the current planner activity feed after the request completes and added a component regression test for the failure path."
  - finding: "Process output could not be observed incrementally without either duplicating the runner or retaining raw provider output."
    change: "Extended the bounded process runner with complete-line observation and passed only decoded, safe event kinds to the activity stream."
  - finding: "The fail-safe activity sink branch for a poisoned in-memory lock was untested and lowered Rust branch coverage below the required threshold."
    change: "Added a fault-tolerance regression test that confirms the sink safely ignores a poisoned stream; the global branch gate is again above 80%."
  - finding: "The activity feed displayed raw ISO timestamps rather than a person’s local time."
    change: "Formatted visible activity times with Intl.DateTimeFormat while preserving the machine-readable dateTime value."
  - finding: "The native planner’s non-structured path lacked a no-process invalid-input regression test."
    change: "Added a non-UTF-8 input test that exercises the native route and fails before any provider process can start."
