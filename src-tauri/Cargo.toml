[package]
name = "kanban-ai-orchestrator"
version = "0.1.0"
description = "Local-first orchestration for AI coding tasks"
authors = ["Kanban AI Orchestrator contributors"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "kanban_ai_orchestrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage,coverage_nightly)"] }
